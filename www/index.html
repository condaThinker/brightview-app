<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="悦为因">
<title>悦为因 · 实修</title>
<style>
  :root{
    --bg:#f6f4ef; --paper:#fffdf8; --ink:#2b2925; --ink2:#4a463f; --muted:#8b8579;
    --line:#e6e0d5; --line2:#d8cfc0; --accent:#8a6a4f; --accent2:#a8794f;
    --soft:#f0e8dd; --ok:#5c7a58; --warm:#b4442e; --cool:#5f7784;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{max-width:520px; margin:0 auto; min-height:100%; padding:0 0 84px; position:relative;}
  button{font-family:inherit; font-size:inherit; color:inherit; border:none; background:none; padding:0; cursor:pointer;}

  /* ---------- 顶部 ---------- */
  .top{padding:26px 22px 14px;}
  .top .date{font-size:13px; color:var(--muted); letter-spacing:.6px;}
  .top .title{font-size:23px; font-weight:600; margin-top:4px; letter-spacing:.5px;}
  .top .quote{margin-top:12px; font-size:13.5px; color:var(--accent); line-height:1.7;
    padding-left:11px; border-left:2px solid var(--soft);}
  .statline{display:flex; align-items:baseline; gap:8px; margin-top:14px; font-size:13px; color:var(--muted);}
  .statline b{font-size:22px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}

  /* ---------- 卡片 ---------- */
  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
    margin:0 16px 12px; padding:18px 18px 16px;}
  .card.hero{padding:22px 20px 20px;}
  .eyebrow{font-size:11.5px; letter-spacing:1.4px; color:var(--muted); text-transform:uppercase;}
  .card h3{margin:6px 0 6px; font-size:19px; font-weight:600; letter-spacing:.3px;}
  .card p{margin:0; font-size:13.5px; color:var(--ink2); line-height:1.75;}
  .card .hint{font-size:12.5px; color:var(--muted); margin-top:8px;}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:15px; border-radius:12px; font-size:16px; font-weight:560;
    background:var(--accent); color:#fff; margin-top:16px; letter-spacing:.5px;
    transition:transform .12s, opacity .12s;}
  .btn:active{transform:scale(.985); opacity:.9;}
  .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--line2);}
  .btn.small{padding:11px; font-size:14px; border-radius:10px; margin-top:0;}
  .btn.done{background:var(--soft); color:var(--accent); pointer-events:none;}

  .row{display:flex; align-items:center; gap:13px; background:var(--paper);
    border:1px solid var(--line); border-radius:12px; margin:0 16px 9px; padding:13px 15px;
    cursor:pointer;}
  .row .dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line2); flex:0 0 auto;}
  .row .dot.on{background:var(--accent); border-color:var(--accent);}
  .row .rt{flex:1; min-width:0;}
  .row .rt .n{font-size:14.5px; font-weight:520;}
  .row .rt .s{font-size:12px; color:var(--muted); margin-top:1px;}
  .row .go{font-size:12.5px; color:var(--accent); flex:0 0 auto;}

  /* ---------- 睡前五问 ---------- */
  .q5{margin-top:15px;}
  .q5:first-child{margin-top:18px;}
  .q5btn{display:block; width:100%; text-align:left; background:none; border:0; padding:0;
    font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .q5btn:active{opacity:.62;}
  .q5h{display:flex; align-items:baseline; gap:8px;}
  .q5n{font-size:12px; color:var(--accent); letter-spacing:.5px; flex:0 0 auto;
    width:17px; font-variant-numeric:tabular-nums;}
  .q5k{font-size:11px; color:var(--soft); letter-spacing:1.5px;}
  .q5go{margin-left:auto; font-size:11.5px; color:var(--accent); flex:0 0 auto;}
  .q5q{font-size:14.5px; line-height:1.75; color:var(--ink); margin-top:3px; padding-left:25px;}
  .q5s{font-size:12px; line-height:1.7; color:var(--muted); margin-top:2px; padding-left:25px;}
  .q5a{font-size:13.5px; line-height:1.9; color:var(--ink2); margin-top:7px; margin-left:25px;
    padding:2px 6px 2px 11px; border-left:2px solid var(--soft); white-space:pre-wrap;}
  .q5a.empty{color:var(--soft); border-left-style:dashed;}
  .q5.close{margin-top:19px; padding-top:17px; border-top:1px dashed var(--line2);}
  .q5.close .q5n{color:var(--soft);}
  .q5.close .q5q{color:var(--ink2);}

  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    background:var(--soft); color:var(--accent); letter-spacing:.3px;}
  .badge.warn{background:#fbeee9; color:var(--warm);}

  /* ---------- 照片 ---------- */
  .shot{margin-top:14px; border-radius:11px; overflow:hidden; background:var(--soft); position:relative;}
  .shot img{display:block; width:100%; height:auto;}
  .shot .cap{position:absolute; left:0; right:0; bottom:0; padding:8px 11px; font-size:11.5px;
    color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.55));}

  /* ---------- 底部导航 ---------- */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40;
    max-width:520px; margin:0 auto; display:flex;
    background:rgba(246,244,239,.93); backdrop-filter:blur(12px);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);}
  .tabbar button{flex:1; padding:11px 0 12px; font-size:11.5px; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:3px; letter-spacing:.3px;}
  .tabbar button.on{color:var(--accent); font-weight:600;}
  .tabbar .ic{font-size:17px; line-height:1;}

  /* ---------- 百日 ---------- */
  .grid{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-top:16px;}
  .cell{aspect-ratio:1; border-radius:4px; background:#f1ece2; border:1px solid transparent;
    display:flex; align-items:center; justify-content:center; font-size:9px; color:#b9b2a4;}
  .cell.done{background:var(--accent); border-color:var(--accent);}
  .cell.late{background:#e3d3bf;}
  .cell.makeup{background:#f6efe6; border:1px dashed var(--accent);}
  .cell.back{background:#efe6da; border:1px dashed var(--line2);}
  .cell.today{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--accent);}
  .cell.future{background:transparent; border:1px dashed #e8e2d7;}

  .seg{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:18px;}
  .bar{height:4px; border-radius:3px; background:#eee8dd; margin-top:7px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:3px;}

  /* ---------- 日记 ---------- */
  .entry{background:var(--paper); border:1px solid var(--line); border-radius:12px;
    margin:0 16px 9px; padding:14px 15px; cursor:pointer;}
  .entry .eh{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .entry .eh .d{color:var(--ink); font-size:14px; font-weight:560;}
  .entry .et{font-size:13.5px; color:var(--ink2); margin-top:7px; line-height:1.7;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:56px 30px; line-height:2;}

  /* ---------- 设置 ---------- */
  .setrow{display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 0; border-bottom:1px solid var(--line);}
  .setrow:last-child{border-bottom:none;}
  .setrow .k{font-size:14.5px;}
  .setrow .k small{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
  .setrow input[type=time]{border:1px solid var(--line2); background:var(--paper); color:var(--ink);
    border-radius:8px; padding:7px 9px; font-size:15px; font-family:inherit;}
  .switch{width:47px; height:28px; border-radius:20px; background:#e3dccf; position:relative; transition:.2s; flex:0 0 auto;}
  .switch.on{background:var(--accent);}
  .switch i{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .switch.on i{left:22px;}

  /* ---------- 全屏层 ---------- */
  #layer{position:fixed; inset:0; z-index:80; display:none; background:var(--bg);}
  #layer.show{display:block;}
  .sheet{max-width:520px; margin:0 auto; height:100%; overflow-y:auto; padding:0 0 40px;}
  .sh-bar{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px;
    position:sticky; top:0; background:var(--bg); z-index:5;}
  .sh-bar .x{font-size:22px; color:var(--muted); width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;}
  .sh-bar .x:active{background:var(--soft);}
  .sh-bar .step{font-size:12px; color:var(--muted); letter-spacing:1px;}
  .sh-body{padding:10px 22px 30px;}

  .dots{display:flex; gap:6px; justify-content:center; margin:14px 0 26px;}
  .dots i{width:6px; height:6px; border-radius:50%; background:#e0d8ca;}
  .dots i.on{background:var(--accent); width:18px; border-radius:3px;}

  .q{font-size:21px; font-weight:600; line-height:1.6; letter-spacing:.3px; margin:0 0 10px;}
  .qhint{font-size:13px; color:var(--muted); line-height:1.8; margin:0 0 22px;}
  textarea{width:100%; min-height:132px; border:1px solid var(--line2); border-radius:12px;
    background:var(--paper); padding:14px; font-family:inherit; font-size:15.5px; line-height:1.75;
    color:var(--ink); resize:none; outline:none;}
  textarea:focus{border-color:var(--accent);}

  .chips{display:flex; flex-wrap:wrap; gap:9px; margin-top:6px;}
  .chip{padding:9px 15px; border-radius:20px; border:1px solid var(--line2); font-size:13.5px;
    color:var(--ink2); background:var(--paper);}
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .chip.big{width:100%; text-align:left; padding:14px 16px; border-radius:11px; font-size:14.5px; line-height:1.6;}

  /* 呼吸 */
  .breath{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; text-align:center; position:relative;}
  .orb{width:190px; height:190px; border-radius:50%; background:radial-gradient(circle at 38% 32%,#f7ecdf,#e4d3be);
    transition:transform 3s cubic-bezier(.4,0,.3,1), opacity 1s; opacity:.9;}
  .orb.in{transform:scale(1.42);}
  .breath .bt{font-size:19px; font-weight:600; margin-top:44px; letter-spacing:.6px; min-height:30px;}
  .breath .bs{font-size:13px; color:var(--muted); margin-top:8px;}
  .breath .count{position:absolute; bottom:52px; font-size:12.5px; color:var(--muted); letter-spacing:2px;}

  .closing{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:44px 34px; text-align:center;}
  .closing .big{font-size:24px; line-height:1.85; font-weight:600; letter-spacing:.6px; white-space:pre-line;}
  .closing .sm{font-size:13px; color:var(--muted); margin-top:20px; line-height:1.9;}

  .toastbox{position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px); z-index:120;
    background:var(--ink); color:#fff; font-size:13.5px; padding:10px 20px; border-radius:22px;
    opacity:0; pointer-events:none; transition:.25s; max-width:80%; text-align:center;}
  .toastbox.show{opacity:1; transform:translate(-50%,0);}

  .srcmark{font-size:11.5px; color:var(--muted); margin-top:12px; text-decoration:underline;
    text-underline-offset:2px; text-decoration-color:var(--line2);}

  .rebound{margin:0 16px 12px; padding:14px 16px; border-radius:12px; background:#fbf3e6;
    border:1px solid #ecdcc2; font-size:13px; line-height:1.8; color:#7a5c31; position:relative;}
  .rebound b{color:#8a5a1e;}
  .rebound .x2{position:absolute; right:8px; top:6px; font-size:16px; color:#b79b74; padding:4px 8px;}

  .photo-lock{font-size:11.5px; color:var(--muted); margin-top:9px; display:flex; align-items:center; gap:5px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toastbox" id="toast"></div>

<script>
(function(){
'use strict';

/* ==================== 基础工具 ==================== */
var app = document.getElementById('app');
var layer = document.getElementById('layer');
var toastEl = document.getElementById('toast');
var pad = function(n){ return n<10 ? '0'+n : ''+n; };
var ymd = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var parseYmd = function(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
var todayKey = function(){ return ymd(new Date()); };
var diffDays = function(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); };
var hm = function(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); };
var WD = ['日','一','二','三','四','五','六'];
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var toast = function(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
};

/* ==================== 状态 ==================== */
var KEY = 'ywy.v1';
var st = (function(){
  try{ var o = JSON.parse(localStorage.getItem(KEY)); if(o && o.records) return o; }catch(e){}
  return { settings:{}, records:{}, flags:{} };
})();
if(!st.flags) st.flags = {};
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(st)); }
  catch(e){ toast('本地空间不足，请先在设置里导出备份'); }
}
function rec(date){ return st.records[date]; }
function R(date){
  if(!st.records[date]) st.records[date] = { date:date, kind:'normal' };
  return st.records[date];
}
function dayIndex(date){
  var s = st.settings.startDate; if(!s) return 1;
  return Math.max(1, diffDays(s, date) + 1);
}
function countOnTime(){
  var n=0; for(var k in st.records){ if(st.records[k].wake && st.records[k].wake.onTime) n++; }
  return n;
}
function countRecorded(){
  var n=0; for(var k in st.records){ var r=st.records[k];
    if(r.kind==='backfill' || r.kind==='makeup' || r.wake || r.night) n++; }
  return n;
}

/* ==================== 照片存储（IndexedDB，失败回退 localStorage） ==================== */
var dbp = null;
function openDB(){
  if(dbp) return dbp;
  dbp = new Promise(function(res, rej){
    if(!window.indexedDB) return rej(new Error('no idb'));
    var r = indexedDB.open('ywy-photos', 1);
    r.onupgradeneeded = function(){ try{ r.result.createObjectStore('p'); }catch(e){} };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    setTimeout(function(){ rej(new Error('timeout')); }, 2500);
  });
  return dbp;
}
var PS = {
  mode:'idb',
  put: function(id, data){
    var self = this;
    if(self.mode === 'idb'){
      return openDB().then(function(d){
        return new Promise(function(res, rej){
          var t = d.transaction('p','readwrite'); t.objectStore('p').put(data, id);
          t.oncomplete = function(){ res(); }; t.onerror = function(){ rej(t.error); };
        });
      }).catch(function(){ self.mode='ls'; return self.put(id, data); });
    }
    try{ localStorage.setItem('ywyp.'+id, data); }catch(e){ toast('照片存不下了，可先导出再清理'); }
    return Promise.resolve();
  },
  get: function(id){
    var self = this;
    if(self.mode === 'idb'){
      return openDB().then(function(d){
        return new Promise(function(res, rej){
          var t = d.transaction('p','readonly'); var q = t.objectStore('p').get(id);
          q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ rej(q.error); };
        });
      }).catch(function(){ self.mode='ls'; return self.get(id); });
    }
    return Promise.resolve(localStorage.getItem('ywyp.'+id));
  }
};

/* ==================== 原文出处 ==================== */
var SRC = {
  wake:{ t:'早起打卡', ep:'悦医养身 14 / 36 / 39',
    x:'「06:30 之前，人已经到户外。」整个百日行动所有项目里，只有这一件事是被打勾的那个。判定标准不是「我起床了」，而是「我人在外面」。拍一张带时间水印的照片，是为了不给自己留自欺的口子。' },
  breath:{ t:'起床练心 · 五呼吸', ep:'悦医养身 14',
    x:'醒来先别睁眼。跟着五个呼吸走：第一个呼吸——要醒了；第二个——更清醒；第三个——已经完全清醒；第四个——在心里说「我人已醒，愿我心意行」；第五个之后，在心里数 3、2、1，再睁眼。' },
  nap:{ t:'盒子午休', ep:'悦医养身 14 / 43',
    x:'中午只充 20 分钟，不是为了补觉，是为了保住晚上的困意。进盒子之前先想好：怎么让自己一定出得来。' },
  night:{ t:'睡前五问', ep:'悦医养身 17',
    x:'① 今天为自己注入什么善因了 ② 今天有没有得到一次「照镜子」的机会 ③ 今天有没有在外界感受到一丝一毫的善意 ④ 此刻还有没有残留一丝一毫的污水 ⑤ 今天无论好坏都过去了，辛苦了。第五句不是提问，是收尾。' },
  four:{ t:'睡眠四问', ep:'悦医养身 19',
    x:'到点不想睡 / 想睡却不困 / 困也睡不着 / 睡还睡不好——四种是完全不同的问题，用药、用功、用劲的方向都不一样。先分诊，再动手。' },
  spy:{ t:'熬夜侦探', ep:'悦医养身 47 / 38',
    x:'定的是「躺到床上」的时间，不是入睡时间。然后每天记：打算几点躺 → 实际几点 → 偏差是被什么牵住的。看不见的锁链，只能靠记录看见。' },
  backfill:{ t:'断签即数据', ep:'七年改命 14',
    x:'中断了几天回来，不用从头开始，也不用自责。只做一件事：把那段空白记成数据——「1 到 5 号状态差，没写」。断了也是数据。' },
  rebound:{ t:'反弹预期', ep:'七年改命 01 / 12',
    x:'弹簧压下去，一定会弹回来。弹回来的时候不是「你不行」，是弹簧系数还没改。这个 App 提前告诉你，是为了让你到时候别慌。' },
  xunxi:{ t:'为什么一天只推一集', ep:'安静之路 61《过往熏习指南》',
    x:'「新人一看有这么多内容，觉得相见恨晚，恨不得一天全看完……这样好不好？也好也不好。过于走马观花，不太好。」原作者给出的办法是按时间、精力、心境分压缩等级，对号入座。他唯一提醒的是：压缩可以，但别只挑简单的看。所以这里的顺序是固定的——看完了才解锁下一集。' },
  makeup:{ t:'补卡的规矩', ep:'悦医养身 45 / 48 / 49',
    x:'45 集里原作者自己给过一次豁免：第二个十天的第 21、22、23 天「统一放假三天，不用打卡，直接打勾」。这说明补卡不是作弊，前提是它有边界、有配额、说得清。48、49 集讲反破窗——「被迫崩盘的时候，就像车窗破了，你越破越…」，所以要给它一个可控的出口。这里定的规矩：每 10 天一张、最多存 3 张、只能补最近 3 天、补的格子看得见、并且不算进「到户外」的天数。' },
  sword:{ t:'七剑', ep:'悦医养身 06–12',
    x:'七剑不是七个技巧，是七个方向：荡尘断它的环境，引光堵你自己的漏洞，松心让阴阳不断，聚灵把正气存住，曲魅拆掉最外层那层假美，斩魔正面打本体，最后合一。'+

  shot:{ t:'人生截图', ep:'安静之路 06 / 悦医养身 05·33',

  lx:{ t:'红尘炼心', ep:'安静之路 26 / 27 / 28',
    x:'「从今天起，我将手把手带大家开始实际修行——在日常生活的言行点滴当中修行，我称之为红尘炼心……过好一天，其实就能过好一年，就能过好一生。」'+

var SORDER = { A:0, Y:1, Q:2, H:3 };

var EP = EP_RAW.map(function(line){
  var f = line.split('|');
  return { key:f[0]+'-'+f[1], s:f[0], no:+f[1], date:f[2], dur:f[3], title:f[4], bv:f[5] };
});
EP.sort(function(a,b){
  if(a.date !== b.date) return a.date < b.date ? -1 : 1;
  if(a.s !== b.s) return SORDER[a.s] - SORDER[b.s];
  return a.no - b.no;
});

/* 原片间隔：相邻两集的实际发布日差，收敛到 1–3 天（同日连发算 1 天） */
function cumOffsets(list){
  var out = [0];
  for(var i=1;i<list.length;i++){
    var g = 1, a = list[i-1].date, b = list[i].date;
    if(a && b){
      var d = Math.round((new Date(b) - new Date(a)) / 86400000);
      g = Math.max(1, Math.min(3, d));
    }
    out.push(out[i-1] + g);
  }
  return out;
}

/* ==================== 熏习状态 ==================== */
function course(){
  if(!st.course) st.course = { start: null, done:{}, half:{}, shown:null, filter:'ALL' };
  if(!st.course.start) st.course.start = st.settings.startDate || todayKey();
  return st.course;
}
function filteredEP(){
  var c = course();
  return c.filter === 'ALL' ? EP : EP.filter(function(e){ return e.s === c.filter; });
}
function queueHead(){
  var list = filteredEP(), c = course();
  for(var i=0;i<list.length;i++){
    if(!c.done[list[i].key]) return { ep:list[i], pos:i, list:list };
  }
  return null;
}
function duePos(list){
  var c = course();
  var elapsed = diffDays(c.start, todayKey());
  var cum = cumOffsets(list), due = 0;
  for(var i=0;i<cum.length;i++){ if(cum[i] <= elapsed) due = i; }
  return due;
}

function swordGuide(k){
  var g = SWORD_G.filter(function(x){ return x.k === k; })[0];
  if(!g) return;
  var done = ssGet(k);
  var n = Object.keys(done).length;
  var total = g.steps.length;
  var picked = ((R(todayKey()).swords) || []).indexOf(k) >= 0;

  var prev = 0;
  var oldSheet = layer.querySelector('.sheet');
  if(oldSheet) prev = oldSheet.scrollTop;

  var h = '<div class="sheet">'+ bar('', n +' / '+ total) +'<div class="sh-body">'+
    '<div class="eyebrow">'+ g.ep +' · '+ g.no +'</div>'+
    '<h2 style="font-size:24px;margin:10px 0 8px">'+ g.k +'</h2>'+
    '<p style="font-size:14.5px;line-height:1.95;color:var(--ink2)">'+ g.one +'</p>'+
    '<div style="margin-top:18px;padding:14px 16px;background:#faf6ef;border-radius:10px;font-size:13px;line-height:1.95;color:var(--accent)">'+
      g.tip +'</div>'+
    '<div class="eyebrow" style="margin-top:28px">做到哪一步，勾哪一步</div>'+
    '<div class="hint" style="margin-top:7px;line-height:1.9">'+
      (n === total
        ? '这一剑的 '+ total +' 步都走过了。勾着的会一直留着。'
        : '这一剑不是一天能做完的，慢慢来。勾过的会留着，不用每天重来。') +
      '</div>';

  g.steps.forEach(function(s, i){
    var on = !!done[i];
    h += '<button data-act="ss" data-k="'+ k +'" data-i="'+ i +'" '+
      'style="display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;'+
      'border-bottom:1px solid #f6f1e8;padding:13px 0;cursor:pointer">'+
      '<span style="flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;'+
        'border:1.5px solid '+(on?'var(--accent)':'var(--line2)')+';'+
        'background:'+(on?'var(--accent)':'transparent')+';display:flex;align-items:center;justify-content:center;'+
        'color:#fff;font-size:10px;line-height:1">'+(on?'✓':'')+'</span>'+
      '<span style="flex:1;font-size:13.8px;line-height:1.85;color:'+(on?'var(--muted)':'var(--ink2)')+'">'+ s +'</span>'+
      (on ? '<span style="flex:none;font-size:10.5px;color:var(--soft);margin-top:4px">'+ (done[i]||'').slice(5) +'</span>' : '')+
      '</button>';
  });

  h += '<button class="btn" style="margin-top:24px" data-act="sword-pick" data-k="'+ g.k +'">'+
      (picked ? '今天这一剑已经记过' : '把这一剑记到今天') +'</button>'+
    '<a class="btn ghost" style="margin-top:10px;display:block;text-align:center;text-decoration:none;box-sizing:border-box" '+
      'href="https://www.bilibili.com/video/'+ g.bv +'" target="_blank" rel="noopener">去 B 站看这一集</a>'+
    '<button class="srcmark" data-act="src" data-k="sword">出处 · '+ g.ep +'</button>'+
    '</div></div>';
  openLayer(h);
  var ns = layer.querySelector('.sheet');
  if(ns) ns.scrollTop = prev;
}

/* ---- 红尘炼心 ---- */

  html += '</div>';

  return html;

/* 把「那句话」从输入框收进状态：切换勾选或关页面前都要调，否则输入会丢 */
function lxReadLine(){
  var el = document.getElementById('lx-line');
  if(!el) return false;
  var tk = tomorrowKey();
  if(!st.lxPrep) st.lxPrep = {};
  if(!st.lxPrep[tk]) st.lxPrep[tk] = { items:{}, line:'', at:null };
  st.lxPrep[tk].line = (el.value || '').trim();
  st.lxPrep[tk].at = new Date().toISOString();
  return true;
}

    '</div>'+

    '<div style="margin-top:18px;border-top:1px solid #f2ece2">'+

  /* 调心六法 */

        return '<button class="chip '+(laws.indexOf(s)>=0?'on':'')+'" data-act="law" data-v="'+s+'">'+
          s + (isLong ? '' : ' ·') +'</button>';
      }).join('')+
    '</div>'+

  html += '<div class="card"><div class="eyebrow">金三角体检 · 十天上一次</div>'+
    '<h3 style="font-size:16px;margin-top:8px">哪一处漏得最凶</h3>'+
    '<p style="font-size:12.5px;color:var(--muted)">1 = 完全失控，5 = 稳。不用客观，凭感觉。</p>';
  TRI.forEach(function(t){

    html += '<div style="margin-top:16px"><div style="font-size:13.5px;margin-bottom:7px">'+ t.n +'</div>'+

    '<button class="srcmark" data-act="src" data-k="stage">出处 · 七年改命 12</button></div>';

  /* 波形 */
  html += waveCard() + spyCard() + shotCard();
  return html;
}

function waveCard(){
  var w = 320, h = 92, n = 30;
  var pts = [];
  var filled = 0;
  for(var i=0;i<n;i++){
    var d = new Date(); d.setDate(d.getDate() - (n-1-i));
    var k = ymd(d);
    var r = st.records[k];
    var yy;
    if(r && r.wake && r.wake.onTime){ yy = 14; }
    else if(r && r.kind === 'makeup'){ yy = 40; }
    else if(r && r.wake){ yy = 48; }
    else { yy = 78; }
    if(yy < 60) filled++;
    pts.push([ (i/(n-1))*w, yy ]);
  }
  var path = pts.map(function(p,i){ return (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = path + ' L' + w + ' ' + h + ' L0 ' + h + ' Z';
  return '<div class="card"><div class="eyebrow">弹簧波形 · 近 30 天</div>'+
    '<h3 style="font-size:16px;margin-top:8px">压下去，会弹回来</h3>'+
    '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;margin-top:14px">'+
      '<path d="'+area+'" fill="rgba(138,106,79,.10)"/>'+
      '<path d="'+path+'" fill="none" stroke="#8a6a4f" stroke-width="1.8" stroke-linejoin="round"/>'+
      '<line x1="0" y1="14" x2="'+w+'" y2="14" stroke="#e6e0d5" stroke-dasharray="3 4"/>'+
    '</svg>'+
    '<div class="hint">高点 = 到户外；中点 = 补卡或过点；低点 = 空着。'+
    '三十天里起来了 '+filled+' 次。起伏是常态，不是失败。</div>'+
    '</div>';
}

/* ---- 熬夜侦探：计划 vs 实际 ---- */
function spyCard(){
  var rows = [];
  Object.keys(st.records).sort().forEach(function(k){
    var n = st.records[k].night;
    if(n && n.bedPlan && n.bedActual) rows.push({ k:k, plan:n.bedPlan, act:n.bedActual });
  });
  if(!rows.length){
    return '<div class="card"><div class="eyebrow">熬夜侦探</div>'+
      '<h3 style="font-size:16px;margin-top:8px">计划和实际的差</h3>'+
      '<p style="font-size:13px;color:var(--muted)">攒够两三天的「打算躺」和「实际躺」，这里会画出偏差。'+
      '看不见的锁链，只能靠两个数并排放才看得见。</p>'+
      '<button class="srcmark" data-act="src" data-k="spy">出处 · 悦医养身 47</button></div>';
  }
  rows = rows.slice(-14);
  var w = 320, h = 104, pad = 10;
  function toMin(t){
    var p = t.split(':'); var hh = +p[0];
    if(hh < 12) hh += 24;
    return hh*60 + (+p[1] || 0);
  }
  var MIN = 21*60, MAX = 26*60;
  var Y = function(m){ return pad + (h-2*pad) * (1 - (m-MIN)/(MAX-MIN)); };
  var X = function(i){ return pad + (w-2*pad) * (rows.length===1 ? .5 : i/(rows.length-1)); };

  var g = '';
  [21,22,23,24,25].forEach(function(hh){
    var yy = Y(hh*60);
    g += '<line x1="0" y1="'+yy.toFixed(1)+'" x2="'+w+'" y2="'+yy.toFixed(1)+'" stroke="#eee7db" stroke-width="1"/>'+
         '<text x="2" y="'+(yy-2).toFixed(1)+'" font-size="7" fill="#b9b2a4">'+(hh>23?(hh-24):hh)+'</text>';
  });
  var marks = '';
  var big = 0;
  rows.forEach(function(r,i){
    var pm = toMin(r.plan), am = toMin(r.act);
    var x = X(i);
    if(Math.abs(am-pm) >= 90) big++;
    marks += '<line x1="'+x.toFixed(1)+'" y1="'+Y(pm).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+Y(am).toFixed(1)+'" '+
      'stroke="#c9b7a1" stroke-width="2"/>'+
      '<circle cx="'+x.toFixed(1)+'" cy="'+Y(pm).toFixed(1)+'" r="2.6" fill="none" stroke="#8a6a4f" stroke-width="1.3"/>'+
      '<circle cx="'+x.toFixed(1)+'" cy="'+Y(am).toFixed(1)+'" r="2.6" fill="#8a6a4f"/>';
  });

  return '<div class="card"><div class="eyebrow">熬夜侦探 · 最近 '+rows.length+' 次</div>'+
    '<h3 style="font-size:16px;margin-top:8px">打算躺 vs 实际躺</h3>'+
    '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;margin-top:12px">'+g+marks+'</svg>'+
    '<div class="hint">空心圈是打算，实心点是实际，竖线是差出来那一段。'+
    (big ? '其中 '+big+' 次差了超过一个半小时。' : '目前偏差都不算大。') +
    '上面是时间轴，越往下越晚。</div>'+
    '<button class="srcmark" data-act="src" data-k="spy">出处 · 悦医养身 47</button></div>';
}

/* ==================== 人生截图 ==================== */
/* 依据三处原文：
   安静之路 06 ——「先从一个人生截图开始，从『1』开始」：允许占位、允许追加、不解决只记录
   悦医养身 05 —— 简历的一次次迭代就是一次次人生截图：成就可视化，只跟自己比
   悦医养身 33 —— 第 100 天把两份摆在一起：「还是你，但完全不是你了」 */
var SHOT_MO = [
  { k:'se',   n:'色魔', q:'此刻，你在这件事上是什么水平？',
    h:'不用美化，也不用忏悔。有多菜就写多菜——这一条是写给一百天后的你看的。' },
  { k:'shui', n:'睡魔', q:'此刻，你和睡觉是什么关系？',
    h:'几点躺下、几点睡着、几点起得来、白天困不困。照实写，别写应该的样子。' },
  { k:'xin',  n:'心魔', q:'此刻，什么最常把你拽走？',
    h:'急、怒、怨、怕、想证明自己、怕落后……写最近一次它得手的那个场面，别写结论。' }
];
var SHOT_LV = ['一点不设防','常常失守','半一半','基本守得住','已经不用管它'];
var SHOT_GRP = { hard:'难题与困惑', cases:'成败与心得', skills:'已点亮的技能点' };

function shots(){
  return (st.shots||[]).filter(function(s){ return s.mo || s.hard || s.one; });
}
function sid(){ return 'x' + Date.now().toString(36) + Math.floor(Math.random()*46656).toString(36); }
function toItems(txt){
  return (txt||'').split('\n').map(function(l){ return l.trim(); })
    .filter(Boolean).map(function(t){ return { id: sid(), t: t, at: todayKey() }; });
}
/* 某张截图之后追加进来的条目（按日期） */
function shotAdds(sh){
  var out = [];
  ['hard','cases','skills'].forEach(function(g){
    (sh[g]||[]).forEach(function(it){
      if(it.at && it.at > sh.date) out.push({ at: it.at, t: it.t, g: g });
    });
  });
  return out.sort(function(a,b){ return a.at < b.at ? -1 : (a.at > b.at ? 1 : 0); });
}
function hasProcess(){
  var l = shots();
  if(l.length > 1) return true;
  return l.some(function(sh){ return shotAdds(sh).length > 0; });
}

/* ---- 时间树：截图的改变过程 ---- */
function shotTree(){
  var list = shots().slice().sort(function(a,b){
    return a.date === b.date ? 0 : (a.date < b.date ? -1 : 1);
  });
  var h = '<div class="sheet">'+ bar('', '时间树') +'<div class="sh-body">'+
    '<div class="eyebrow">人生截图 · 长出来的过程</div>'+
    '<h2 style="font-size:21px;margin:10px 0 8px">一共 '+ list.length +' 张</h2>'+
    '<p class="qhint">每张是一个节点，节点下面挂的是那之后追加的条目。↑ 是跟上一张比，档位往上走了。</p>';
  var prev = null;
  list.forEach(function(sh, i){
    var adds = shotAdds(sh);
    var tag = sh.locked ? '底稿' : (sh.one ? '只写了个「1」' : '第 '+(i+1)+' 张');
    h += '<div style="display:flex;gap:13px;margin-top:'+ (i ? 26 : 20) +'px">'+
      '<div style="flex:none;width:10px;display:flex;flex-direction:column;align-items:center">'+
        '<span style="width:9px;height:9px;border-radius:50%;margin-top:5px;background:'+
          (sh.locked ? 'var(--accent)' : '#fff') +';border:1.5px solid var(--accent)"></span>'+
        '<span style="flex:1;width:1px;background:'+ (i < list.length-1 ? 'var(--soft)' : 'transparent') +';margin-top:6px"></span>'+
      '</div>'+
      '<div style="flex:1;min-width:0;padding-bottom:4px">'+
        '<div style="font-size:14.5px;font-weight:600">'+ sh.date.replace(/-/g,'.') +
          '<span style="font-weight:400;font-size:11.5px;color:var(--muted);margin-left:8px">第 '+ sh.day +' 天 · '+ tag +'</span></div>';

    var moTxt = SHOT_MO.map(function(m){
      var d = (sh.mo||{})[m.k] || {};
      if(!d.lv && !d.t) return '';
      var pv = (prev && prev.mo && prev.mo[m.k]) ? prev.mo[m.k].lv : 0;
      var ar = (pv && d.lv && d.lv !== pv) ? (d.lv > pv ? ' ↑' : ' ↓') : '';
      return m.n +' '+ (d.lv ? SHOT_LV[d.lv-1] : '未评') + ar;
    }).filter(Boolean).join(' · ');
    if(moTxt) h += '<div style="font-size:12.5px;color:var(--ink2);line-height:1.9;margin-top:7px">'+ moTxt +'</div>';

    h += '<div class="hint" style="margin-top:7px">难题 '+ (sh.hard||[]).length +' 条 · 心得 '+
      (sh.cases||[]).length +' 条 · 技能点 '+ (sh.skills||[]).length +' 个</div>';

    adds.forEach(function(a){
      h += '<div style="display:flex;gap:9px;margin-top:9px;font-size:12.5px;line-height:1.8">'+
        '<span style="flex:none;color:var(--accent);font-variant-numeric:tabular-nums">'+ a.at.slice(5).replace('-','.') +'</span>'+
        '<span style="flex:1;color:var(--muted)">追加 · '+ esc(a.t) +'</span></div>';
    });

    h += '<button class="btn ghost small" style="margin-top:12px;width:auto;padding:7px 13px" '+
      'data-act="shot-open" data-id="'+ sh.id +'">打开这张</button></div></div>';
    prev = sh;
  });
  h += '<button class="btn" style="margin-top:28px" data-act="close">收起来</button>'+
    '<button class="srcmark" data-act="src" data-k="shot">出处 · 安静之路 06 / 悦医养身 33</button>'+
    '</div></div>';
  openLayer(h);
}

/* ---- 卡片 ---- */
function shotCard(){
  var list = shots();
  var td = dayIndex(todayKey());
  var html = '<div class="card"><div class="eyebrow">人生截图</div>';

  if(!list.length){
    html += '<h3 style="font-size:16px;margin-top:8px">先给自己截一张</h3>'+
      '<p style="font-size:12.5px;color:var(--muted);line-height:1.95">'+
      '不是打卡，是留底稿：此刻你面对三魔是什么水平、有哪些难题和困惑、已经点亮了什么。'+
      '第 100 天再截一张，两份摆在一起，才知道自己到底动了没有。</p>'+
      '<button class="btn" style="margin-top:16px" data-act="shot-new">截第一张</button>'+
      '<button class="btn ghost small" style="margin-top:10px;width:auto;padding:9px 16px" data-act="shot-one">只想写个「1」</button>';
  } else {
    var last = list[list.length-1];
    html += '<h3 style="font-size:16px;margin-top:8px">'+
      (list.length === 1 ? '底稿 · 第 '+last.day+' 天' : '最近一张 · 第 '+last.day+' 天') +'</h3>';

    if(last.one){
      html += '<div class="hint">只写了个「1」。随时点开往后续——原文说，写得不好再追，删了再写也行。</div>';
    } else {
      html += '<div style="margin-top:12px">'+ SHOT_MO.map(function(m){
        var d = (last.mo||{})[m.k] || {};
        return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid #f2ece2">'+
          '<span style="color:var(--muted)">'+ m.n +'</span>'+
          '<span>'+ (d.lv ? SHOT_LV[d.lv-1] : '—') +'</span></div>';
      }).join('') +'</div>';
      html += '<div class="hint" style="margin-top:12px">难题 '+ (last.hard||[]).length +' 条 · 心得 '+
        (last.cases||[]).length +' 条 · 技能点 '+ (last.skills||[]).length +' 个</div>';
    }

    html += '<div style="display:flex;gap:10px;margin-top:16px">'+
      '<button class="btn" style="flex:1" data-act="shot-open" data-id="'+ last.id +'">打开</button>'+
      (list.length > 1 ? '<button class="btn ghost" style="flex:1" data-act="shot-cmp">对照</button>' : '')+
      '</div>'+
      '<div style="display:flex;gap:10px;margin-top:10px">'+
      '<button class="btn ghost small" style="flex:1;padding:9px 0;width:auto" data-act="shot-new">再截一张</button>'+
      (hasProcess() ? '<button class="btn ghost small" style="flex:1;padding:9px 0;width:auto" data-act="shot-tree">时间树</button>' : '')+
      '</div>';

    if(td >= 100 && list.length < 2){
      html += '<div class="hint" style="margin-top:12px;color:var(--accent)">'+
        '一百天了。该截第二张了——两张摆在一起，才知道差在哪。</div>';
    }
  }

  html += '<button class="srcmark" data-act="src" data-k="shot">出处 · 安静之路 06 / 悦医养身 05</button></div>';
  return html;
}

/* ---- 录一张新截图 ---- */
var sf = null;
function shotNew(){
  sf = { step:0, one:false,
    mo:{ se:{t:'',lv:0}, shui:{t:'',lv:0}, xin:{t:'',lv:0} },
    draft:{ hard:'', cases:'', skills:'' } };
  renderShot();
}
function shotOne(){
  st.shots = st.shots || [];
  var isBase = shots().length === 0;
  st.shots.push({
    id: sid(), date: todayKey(), day: dayIndex(todayKey()),
    mo:{}, hard:[], cases:[], skills:[], one:true,
    kind: isBase ? 'base' : 'again', locked: isBase, lastAdd: new Date().toISOString()
  });
  save(); render(); toast('先占个位。以后随时往后续');
}
function sfRead(){
  var ta = document.getElementById('shot-ta');
  if(!ta) return;
  if(sf.step >= 1 && sf.step <= 3){ sf.mo[SHOT_MO[sf.step-1].k].t = ta.value; }
  else if(sf.step === 4) sf.draft.hard = ta.value;
  else if(sf.step === 5) sf.draft.cases = ta.value;
  else if(sf.step === 6) sf.draft.skills = ta.value;
}
function shotNext(){
  sfRead();
  if(sf.step >= 7) return;
  sf.step++;
  if(sf.step >= 7){ shotFinish(); return; }
  renderShot(); window.scrollTo(0,0);
}

function renderShot(){
  /* 开场 */
  if(sf.step === 0){
    openLayer('<div class="sheet">'+ bar('', '人生截图') +
      '<div class="sh-body">'+
      '<div class="eyebrow">安静之路 · 第 6 集</div>'+
      '<h2 style="font-size:23px;margin:14px 0 16px;line-height:1.55;letter-spacing:.2px">第一课，先不上干货</h2>'+
      '<p style="font-size:14.5px;line-height:2.05;color:var(--ink2)">'+
      '接下来只做一件事：把此刻的你写下来。不评分，不给建议，也不解决任何问题。</p>'+
      '<div style="font-size:13.5px;line-height:2.05;color:var(--muted);padding-left:14px;border-left:2px solid var(--soft);margin-top:20px">'+
      '「这些问题梳理不是为了现在去解答，是将来自己可以解答的。」</div>'+
      '<button class="btn" data-act="shot-next">开始</button>'+
      '<button class="btn ghost" data-act="shot-one">我现在只想写个「1」</button>'+
      '<button class="srcmark" data-act="src" data-k="shot">原文怎么说</button>'+
      '</div></div>');
    return;
  }

  /* 三魔，一屏一位 */
  if(sf.step >= 1 && sf.step <= 3){
    var m = SHOT_MO[sf.step-1];
    var cur = sf.mo[m.k];
    var dots = '';
    for(var i=0;i<3;i++) dots += '<i class="'+ (i <= sf.step-1 ? 'on' : '') +'"></i>';
    openLayer('<div class="sheet">'+ bar('', sf.step+' / 3') +
      '<div class="sh-body">'+
      '<div class="dots">'+ dots +'</div>'+
      '<div class="eyebrow" style="margin-bottom:10px">'+ m.n +'</div>'+
      '<h2 class="q">'+ m.q +'</h2>'+
      '<p class="qhint">'+ m.h +'</p>'+
      '<div class="chips" style="margin-bottom:14px">'+
        SHOT_LV.map(function(lv, ix){
          return '<button class="chip '+ (cur.lv === ix+1 ? 'on' : '') +'" data-act="shot-lv" data-v="'+(ix+1)+'">'+ lv +'</button>';
        }).join('')+
      '</div>'+
      '<textarea id="shot-ta" placeholder="一句话就行。写不出来就写「不知道」">'+ esc(cur.t) +'</textarea>'+
      '<button class="btn" data-act="shot-next">'+ (sf.step === 3 ? '继续' : '下一位') +'</button>'+
      '<button class="srcmark" data-act="src" data-k="shot">原文怎么说</button>'+
      '</div></div>');
    return;
  }

  /* 三组清单 */
  if(sf.step >= 4 && sf.step <= 6){
    var g = sf.step === 4 ? 'hard' : (sf.step === 5 ? 'cases' : 'skills');
    var meta = {
      hard:{ t:'你现在面临多少难题？',
        h:'一行一条。工作、钱、身体、关系、脑子里转个不停的那些念头，都算。不分类，不排序。',
        ph:'钱不够用，一看到同龄人买房就慌\n晚上不想睡，躺着刷到两点\n不知道自己到底在干什么' },
      cases:{ t:'成功和失败的案例、心得',
        h:'原文说「你之前无论有多少成功失败的案例、有多少心得和困惑，都记录下来」。写具体的场面，别写总结。',
        ph:'去年坚持早起两个月，然后崩了\n崩的原因是那周连着加班，回家就报复性刷手机' },
      skills:{ t:'已经点亮的技能点',
        h:'这一条不许谦虚。凡是有阶段成果的，写成一条。以后每有一条就加一条——这是原文里「成就箱」的做法。',
        ph:'能独立做一顿像样的饭\n连续 30 天六点半出门\n把手机搬出卧室，维持了半年' }
    }[g];
    openLayer('<div class="sheet">'+ bar('', (sf.step-3)+' / 3') +
      '<div class="sh-body">'+
      '<h2 class="q" style="font-size:20px">'+ meta.t +'</h2>'+
      '<p class="qhint">'+ meta.h +'</p>'+
      '<textarea id="shot-ta" style="min-height:170px" placeholder="'+ meta.ph +'">'+ esc(sf.draft[g]) +'</textarea>'+
      '<button class="btn" data-act="shot-next">'+ (sf.step === 6 ? '截好了' : '继续') +'</button>'+
      '<button class="btn ghost" data-act="shot-next">这一步先空着</button>'+
      '</div></div>');
    return;
  }
}

function shotFinish(){
  var isBase = shots().length === 0;
  st.shots = st.shots || [];
  st.shots.push({
    id: sid(), date: todayKey(), day: dayIndex(todayKey()),
    mo: sf.mo,
    hard: toItems(sf.draft.hard),
    cases: toItems(sf.draft.cases),
    skills: toItems(sf.draft.skills),
    one: false, kind: isBase ? 'base' : 'again', locked: isBase,
    lastAdd: new Date().toISOString()
  });
  save(); sf = null; render();
  openLayer('<div class="sheet"><div class="closing">'+
    '<div class="big">截好了。</div>'+
    '<div class="sm">'+(isBase
      ? '这一张锁死了，改不了，只能往后追加。\n锁着才有对照的价值。\n\n第一百天回来，再截一张。'
      : '两份摆在一起看，才知道差在哪。')+'</div>'+
    '<button class="btn" style="margin-top:36px;width:210px" data-act="close">收起来</button>'+
    '</div></div>');
}

/* ---- 看一张 ---- */
function shotDetail(id){
  var sh = shots().filter(function(x){ return x.id === id; })[0];
  if(!sh) return;
  var h = '<div class="sheet">'+ bar('', '第 '+ sh.day +' 天') +'<div class="sh-body">';
  h += '<div class="eyebrow">'+ (sh.locked ? '底稿 · 锁住的' : '第 '+ sh.day +' 天的截图') +'</div>'+
    '<h2 style="font-size:21px;margin:10px 0 8px">'+ sh.date.replace(/-/g,'.') +'</h2>';
  if(sh.locked) h += '<div class="hint" style="margin-bottom:6px">这张不能改，只能往后追加。改了就失去对照的意义了。</div>';
  if(sh.one) h += '<div class="hint" style="margin-bottom:6px">当时只写了个「1」。现在补上也不迟。</div>';
  var adds0 = shotAdds(sh);
  if(adds0.length) h += '<div class="hint" style="margin-bottom:6px">这张之后追加了 '+ adds0.length +' 条，最近一次 '+
    adds0[adds0.length-1].at.slice(5).replace('-','.') +'。左边带日期的是追加进来的。</div>';

  SHOT_MO.forEach(function(m){
    var d = (sh.mo||{})[m.k] || {};
    if(!d.t && !d.lv) return;
    h += '<div style="margin-top:26px">'+
      '<div class="eyebrow">'+ m.n + (d.lv ? ' · '+ SHOT_LV[d.lv-1] : '') +'</div>'+
      (d.t ? '<div style="font-size:14.5px;line-height:1.95;color:var(--ink2);margin-top:9px">'+ esc(d.t) +'</div>' : '')+
      '</div>';
  });

  ['hard','cases','skills'].forEach(function(g){ h += shotGroupBlock(sh, g); });

  h += '<button class="btn" style="margin-top:32px" data-act="close">收起来</button>'+

function shotCompare(){
  var list = shots();
  if(list.length < 2) return;
  var a = list[0], b = list[list.length-1];
  if(!st.shotCmp) st.shotCmp = {};
  var mk = st.shotCmp[b.id] || (st.shotCmp[b.id] = {});

  var h = '<div class="sheet">'+ bar('', '对照') +'<div class="sh-body">'+
    '<div class="eyebrow">第 '+ a.day +' 天 → 第 '+ b.day +' 天</div>'+
    '<h2 style="font-size:21px;margin:12px 0 10px;line-height:1.6">还是你，<br>但完全不是你了。</h2>'+
    '<div class="hint" style="line-height:1.95">这句话是原作者第 100 天说的原话。下面是两天的三魔自评，'+
    '还有当初那张单子——你现在可以逐条判断，它还在不在。</div>';

  /* 三魔对照 */
  h += '<div style="margin-top:26px"><div class="eyebrow">三魔</div>';
  SHOT_MO.forEach(function(m){
    var da = (a.mo||{})[m.k] || {}, db = (b.mo||{})[m.k] || {};
    h += '<div style="display:flex;align-items:center;gap:10px;margin-top:13px;font-size:13px">'+
      '<span style="width:38px;color:var(--muted);flex:none">'+ m.n +'</span>'+
      '<span style="flex:1;text-align:right;color:var(--muted)">'+ (da.lv ? SHOT_LV[da.lv-1] : '—') +'</span>'+
      '<span style="color:var(--soft);flex:none">→</span>'+
      '<span style="flex:1">'+ (db.lv ? SHOT_LV[db.lv-1] : '—') +'</span></div>';
  });
  h += '</div>';

  /* 当初的难题，逐条判定 */
  if((a.hard||[]).length){
    h += '<div style="margin-top:28px"><div class="eyebrow">当初那些难题，现在呢</div>'+
      '<div class="hint" style="margin-top:9px">点一下切换判断。这个判断只给你自己看，不计分。</div>';
    a.hard.forEach(function(it){
      var v = mk[it.id] || '';
      h += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #f2ece2">'+
        '<div style="font-size:14px;line-height:1.9;color:var(--ink2)">'+ esc(it.t) +'</div>'+
        '<div class="chips" style="margin-top:10px">'+
          [['a','已经化解'],['b','变了，但还在'],['c','一点没动']].map(function(o){
            return '<button class="chip '+ (v === o[0] ? 'on' : '') +'" data-act="shot-mark" data-id="'+ b.id +'" data-i="'+ it.id +'" data-v="'+ o[0] +'">'+ o[1] +'</button>';
          }).join('')+
        '</div></div>';
    });
    h += '</div>';
  }

  /* 新长出来的 */
  if((b.hard||[]).length){
    h += '<div style="margin-top:28px"><div class="eyebrow">现在的问题</div>';
    b.hard.forEach(function(it){
      h += '<div style="font-size:14px;line-height:1.9;color:var(--ink2);margin-top:10px">· '+ esc(it.t) +'</div>';
    });
    h += '</div>';
  }

  /* 技能点增量 */
  var sa = (a.skills||[]).length, sb = (b.skills||[]).length;
  h += '<div class="hint" style="margin-top:26px;line-height:1.95">技能点：'+ sa +' → '+ sb +
    ' 个' + (sb > sa ? '。多出来的这些，是这一天一天攒下来的。' : '。还没加过新的，也没关系。') +'</div>';

  h += '<button class="btn" style="margin-top:30px" data-act="close">收起来</button>'+
    '<button class="srcmark" data-act="src" data-k="shot">出处 · 悦医养身 33</button>'+
    '</div></div>';
  openLayer(h);
}

function reboundBanner(){

function viewToday(){
  var now = new Date();
  var key = ymd(now);
  var r = rec(key) || {};
  var idx = dayIndex(key);
  var h = now.getHours() + now.getMinutes()/60;
  var low = !!st.settings.low;

  var quote = QUOTES[idx % QUOTES.length];
  /* 主卡按时段排队：晚上轮到睡前收工，别让没打卡的早晨一直占着主位 */
  var primary = 'done';
  if(h >= 17 || h < 4){
    primary = 'night';
  } else {
    var order;
    if(h >= 11 && h < 15) order = ['nap','wake','night'];
    else order = ['wake','night','nap'];
    if(low) order = order.filter(function(k){ return k !== 'nap'; });
    for(var oi = 0; oi < order.length; oi++){
      if(!r[order[oi]]){ primary = order[oi]; break; }
    }
  }

  var html = '<div class="top">'+
    '<div class="date">'+ (now.getMonth()+1) +' 月 '+ now.getDate() +' 日 · 周'+ WD[now.getDay()] +
      ' · 第 '+ idx +' 天</div>'+
    '<div class="title">'+ (low ? '低谷模式' : '今天，只做该做的') +'</div>'+
    '<div class="quote">'+ quote +'</div>'+
    '<div class="statline">已做到 <b>' + countOnTime() + '</b> 个早晨</div>'+
    '</div>';

  html += reboundBanner();

  if(primary === 'wake') html += cardWake(r, key, true);
  else if(primary === 'night') html += cardNight(r, key, true);
  else if(primary === 'nap') html += cardNap(r, key, true);
  else html += cardDone(r, key);

  if(primary !== 'wake') html += rowWake(r, key);
  if(primary !== 'nap' && !low) html += rowNap(r, key);
  if(primary !== 'night') html += rowNight(r, key);
  html += rowLx();
  html += rowXunxi();

  var pa = st.flags.pendingActual;
  if(pa && st.records[pa] && st.records[pa].night && st.records[pa].night.bedPlan
     && !st.records[pa].night.bedActual){
    html += cardActual(pa);
  }

  if(!low){
    html += '<div class="card" style="background:transparent;border:none;padding:14px 20px 0;">'+
      '<button class="srcmark" data-act="src" data-k="rebound" style="background:none;border:none;padding:0;">为什么这里没有连续天数、没有排行榜</button></div>';
  }
  return html;
}

/* ==================== 百日页 ==================== */
function viewPlan(){
  var key = todayKey();
  var idx = dayIndex(key);
  var cycleStart = Math.floor((idx-1)/100)*100 + 1;
  var inCycle = ((idx-1) % 100) + 1;
  var start = parseYmd(st.settings.startDate);
  var seg = Math.ceil(inCycle/10);
  var segDone = Math.max(0, inCycle - (seg-1)*10);

  var cells = '';
  for(var i=1;i<=100;i++){
    var d = new Date(start); d.setDate(start.getDate() + cycleStart - 1 + i - 1);
    var k = ymd(d); var r = st.records[k];
    var cls = 'cell';
    if(i > inCycle) cls += ' future';
    else if(r && r.wake && r.wake.onTime) cls += ' done';
    else if(r && r.kind === 'makeup') cls += ' makeup';
    else if(r && r.wake) cls += ' late';
    else if(r && r.kind === 'backfill') cls += ' back';
    else if(i === inCycle) cls += ' today';
    if(i === inCycle) cls += ' today';
    cells += '<div class="'+cls+'" data-act="day" data-d="'+k+'">'+ (i<=inCycle? i : '') +'</div>';
  }

  var missed = [];
  var s0 = parseYmd(st.settings.startDate);
  for(var j=0;j<idx-1;j++){
    var dd = new Date(s0); dd.setDate(s0.getDate()+j);
    var kk = ymd(dd);
    if(!st.records[kk]) missed.push(kk);
  }

  return '<div class="top"><div class="date">第 '+cycleStart+' – '+(cycleStart+99)+' 天</div>'+
    '<div class="title">百日筑基</div>'+
    '<div class="statline">已做到 <b>'+countOnTime()+'</b> 天 · 已记下 <b>'+countRecorded()+'</b> 天'+
      (((st.cards && st.cards.used) || []).length
        ? ' · 补卡 <b>'+st.cards.used.length+'</b>' : '') +'</div></div>'+

    '<div class="card"><div class="seg"><span>第 '+seg+' 段 · 第 '+
      (cycleStart+(seg-1)*10)+'–'+(cycleStart+seg*10-1)+' 天</span><span>'+segDone+' / 10</span></div>'+
      '<div class="bar"><i style="width:'+(segDone*10)+'%"></i></div>'+
      '<div class="grid">'+ cells +'</div>'+
      '<div class="hint" style="margin-top:14px;line-height:1.9">浅色 = 那天记了但没赶上点；虚线 = 那天没记。'+
      '这里不标红，也不清零。</div>'+
    '</div>'+

    (missed.length ? '<div class="card" style="background:#fbf8f3">'+
      '<div class="eyebrow">空着的那些天</div>'+
      '<h3 style="font-size:16px;margin-top:8px">有 '+missed.length+' 天没有记录</h3>'+
      '<p style="font-size:13px">不用补得很漂亮，写一句状态就够了。空白填成数据，它就不再是失败。</p>'+
      '<button class="btn ghost small" style="margin-top:14px" data-act="backfill">补一句</button>'+
      '<button class="srcmark" data-act="src" data-k="backfill">出处 · 七年改命 14</button></div>' : '')+

    '<div class="card"><div class="eyebrow">段的节奏</div>'+

}

/* ---------- 补卡 ---------- */
function cardsEarned(){
  var idx = dayIndex(todayKey());
  return Math.max(0, Math.floor(idx/10));   /* 每满 10 天，得一张 */
}
function cardsLeft(){
  var used = (st.cards && st.cards.used) || [];
  return Math.max(0, Math.min(3, cardsEarned() - used.length));
}
function makeupCandidates(){
  var out = [];
  for(var i=1;i<=3;i++){
    var d = new Date(); d.setDate(d.getDate()-i);
    var k = ymd(d);
    var r = st.records[k];
    if(r && (r.kind === 'makeup' || (r.wake && r.wake.onTime))) continue;
    out.push(k);
  }
  return out;
}
function makeupCard(){
  var left = cardsLeft();
  var cands = makeupCandidates();
  var used = ((st.cards && st.cards.used) || []).length;

  var html = '<div class="card" style="background:#fbf8f2">'+
    '<div class="eyebrow">补卡 · 有条件的</div>'+
    '<h3 style="font-size:16px;margin-top:8px">手上还有 '+left+' 张</h3>'+
    '<p style="font-size:13px">每满 10 天得一张，最多存 3 张。只能补最近 3 天，'+
    '补上的那天记作「补」，不算进「到户外」的天数。</p>';

  if(!cands.length){
    html += '<div class="hint">最近三天没有能补的。要么做到了，要么已经超过三天的窗口。</div>';
  } else if(left <= 0){
    html += '<div class="hint">配额用完了。等到第 '+((Math.floor(dayIndex(todayKey())/10)+1)*10)+' 天，会再得一张。</div>';
  } else {
    html += '<div class="chips" style="margin-top:14px">'+
      cands.map(function(k){
        var d = parseYmd(k);
        return '<button class="chip" data-act="makeup" data-d="'+k+'">'+
          (d.getMonth()+1)+'/'+d.getDate()+' 补上</button>';
      }).join('')+'</div>';
  }
  if(used) html += '<div class="hint" style="margin-top:12px">累计已补 '+used+' 次。补过的日子在格子里是空心虚线，看得见。</div>';
  html += '<button class="srcmark" data-act="xsrc" data-k="makeup">补卡的规矩是怎么来的</button></div>';
  return html;
}

/* ---- 拍照打卡 ---- */
function shootFlow(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0];
    document.body.removeChild(inp);
    if(!f) return;
    watermark(f).then(function(dataUrl){
      var key = todayKey();
      var id = 'ph-' + key;
      return PS.put(id, dataUrl).then(function(){
        var r = R(key);
        var now = new Date();
        var target = st.settings.wakeTarget || '06:30';
        var cur = hm(now);
        r.wake = { at: ymd(now)+'T'+cur, onTime: cur <= target, photoId: id };
        var y = new Date(now); y.setDate(y.getDate()-1);
        st.flags.pendingActual = ymd(y);
        save();
        showWakeResult(r.wake, target);
      });
    }).catch(function(e){
      toast('这张照片处理失败，再试一次');
    });
  });
  inp.click();
}

function watermark(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var max = 1080;
        var sc = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * sc), hh = Math.round(img.height * sc);
        var c = document.createElement('canvas'); c.width = w; c.height = hh;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, hh);
        var g = ctx.createLinearGradient(0, hh*0.7, 0, hh);
        g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.58)');
        ctx.fillStyle = g; ctx.fillRect(0, hh*0.7, w, hh*0.3);
        var p = Math.round(w*0.048);
        var now = new Date();
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'alphabetic';
        ctx.font = '600 ' + Math.round(w*0.052) + 'px system-ui,-apple-system,"PingFang SC",sans-serif';
        ctx.fillText(ymd(now).replace(/-/g,'.') + '  ' + hm(now), p, hh - p*2.1);
        ctx.font = '400 ' + Math.round(w*0.034) + 'px system-ui,-apple-system,"PingFang SC",sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,.88)';
        ctx.fillText('悦为因 · 第 ' + dayIndex(ymd(now)) + ' 天 · 人在户外', p, hh - p*1.0);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.72));
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('load fail')); };
    img.src = url;
  });
}

/* ---- 五呼吸 ---- */
var BREATH = [
  { t:'第一个呼吸', s:'要醒了。', ph:'in' },
  { t:'第二个呼吸', s:'更清醒了。', ph:'in' },
  { t:'第三个呼吸', s:'已经完全清醒。', ph:'in' },
  { t:'第四个呼吸', s:'我人已醒，愿我心意行。', ph:'in' },
  { t:'第五个呼吸', s:'睁开眼之前，在心里数 3、2、1。', ph:'in' }
];
function breathFlow(){
  var i = 0;
  openLayer('<div class="sheet"><div class="breath" id="br">'+
    '<div class="orb" id="orb"></div>'+
    '<div class="bt" id="bt">别睁眼</div>'+
    '<div class="bs" id="bs">跟着呼吸走，五个就够</div>'+
    '<div class="count" id="bc">1 / 5</div>'+
    '<button class="btn ghost" style="position:absolute;bottom:96px;left:30px;right:30px" data-act="close">跳过</button>'+
    '</div></div>');
  var orb = document.getElementById('orb');
  var bt = document.getElementById('bt');
  var bs = document.getElementById('bs');
  var bc = document.getElementById('bc');

  function step(){
    if(i >= BREATH.length){
      var key = todayKey(); var r = R(key); r.breath = true; save();
      openLayer('<div class="sheet"><div class="closing">'+
        '<div class="big">三。二。一。\n睁眼。</div>'+
        '<div class="sm">今天的第一步已经走完了。<br>剩下的，一件一件来。</div>'+
        '<button class="btn" style="margin-top:34px;width:220px" data-act="close">起身</button>'+
        '</div></div>');
      return;
    }
    var b = BREATH[i];
    bt.textContent = b.t; bs.textContent = b.s;
    bc.textContent = (i+1) + ' / 5';
    if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
    orb.classList.remove('in');
    setTimeout(function(){ orb.classList.add('in'); }, 60);
    orb.style.transitionDuration = '3s';
    setTimeout(function(){ orb.classList.remove('in'); }, 3300);
    i++;
    setTimeout(step, 6400);
  }
  setTimeout(step, 500);
}

    left--;
    if(left <= 0){
      clearInterval(t);
      if(navigator.vibrate) try{ navigator.vibrate([400,200,400,200,600]); }catch(e){}
      el.textContent = '00:00';
      el.style.fontSize = '26px';
      el.textContent = '到点了，起来';
      document.querySelector('[data-act="nap-end"]').textContent = '我起来了';
      return;
    }
    el.textContent = pad(Math.floor(left/60)) + ':' + pad(left%60);
    if(left === 300){ if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){} }
  }, 1000);
  layer._napTimer = t;
  layer._napLeft = function(){ return total - left - (total - left); };
  layer._napUsed = function(){ return 20 - Math.ceil(left/60); };
}

function endNap(){
  if(layer._napTimer) clearInterval(layer._napTimer);
  var key = todayKey(); var r = R(key);
  var used = layer._napUsed ? layer._napUsed() : 20;
  r.nap = { min: Math.max(1, used), at: new Date().toISOString() };
  save(); toast('记下了 · ' + r.nap.min + ' 分钟'); closeLayer();
}

var nf = { i:0, a:['','','',''], four:null, bed:null, edit:false, noFour:false, noBed:false };

function nightFlow(startAt){
  nf = { i:0, a:['','','',''], four:null, bed:null, edit:false, noFour:false, noBed:false };
  var saved = rec(todayKey());
  if(saved && saved.night){
    if(saved.night.a){
      nf.a = saved.night.a.slice(0,4);
      while(nf.a.length < QS.length) nf.a.push('');
    }
    if(saved.night.closed){
      nf.edit = true;                       /* 已经写过：点哪句改哪句，不重走全流程 */
      nf.four = saved.night.four || null;
      nf.bed = saved.night.bedPlan || null;
    }
  }
  var resumeAt = 0;
  for(var z = 0; z < QS.length; z++){ if(!nf.a[z]){ resumeAt = z; break; } else { resumeAt = z + 1; } }
  if(typeof startAt === 'number' && startAt >= 0 && startAt < QS.length) nf.i = startAt;
  else if(!nf.edit && resumeAt < QS.length) nf.i = resumeAt;   /* 断在哪儿，就从哪儿接着写 */

/* ---- 导出 ---- */
function download(name, text, mime){
  var b = new Blob([text], {type: mime || 'application/json'});
  var u = URL.createObjectURL(b);
  var a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); }, 3000);
}
function exportJSON(){
  download('悦为因-备份-'+todayKey()+'.json', JSON.stringify({
    app:'悦为因', version:'0.2', exportedAt:new Date().toISOString(),
    settings: st.settings, records: st.records, course: st.course,
    cards: st.cards, jin: st.jin, stage: st.stage, flags: st.flags,
    swordSteps: st.swordSteps, shots: st.shots, lxPrep: st.lxPrep
  }, null, 2));
  toast('已导出（照片不含在内）');
}
function importFlow(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0];
    document.body.removeChild(inp);
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var o = JSON.parse(fr.result);
        if(!o || !o.records) throw new Error('bad');
        if(o.settings) st.settings = o.settings;
        st.records = o.records;
        if(o.course) st.course = o.course;
        if(o.cards) st.cards = o.cards;
        if(o.jin) st.jin = o.jin;
        if(o.stage) st.stage = o.stage;
        if(o.flags) st.flags = o.flags;
        if(o.swordSteps) st.swordSteps = o.swordSteps;
        if(o.shots) st.shots = o.shots;
        if(o.lxPrep) st.lxPrep = o.lxPrep;
        save(); render();
        toast('已恢复 '+Object.keys(st.records).length+' 天记录');
      }catch(e){ toast('这个文件读不了'); }
    };
    fr.readAsText(f);
  });
  inp.click();
}
function exportMD(){
  var keys = Object.keys(st.records).sort();
  var out = ['# 悦为因 · 日记', ''];
  var labels = QS.map(function(q){ return q.k; });
  keys.forEach(function(k){
    var r = st.records[k]; var d = parseYmd(k);
    out.push('## '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 第 '+dayIndex(k)+' 天');
    if(r.wake) out.push('- 晨：'+ r.wake.at.slice(11,16) + (r.wake.onTime ? '' : '（过点）'));
    if(r.nap) out.push('- 午：盒子 '+ r.nap.min +' 分钟');
    if(r.night && r.night.a){
      r.night.a.forEach(function(t,i){ if(t) out.push('- '+labels[i]+'：'+t); });
      if(r.night.closed) out.push('- 收尾：'+ Q_CLOSE.q);
      if(r.night.bedPlan) out.push('- 躺下：计划 '+r.night.bedPlan + (r.night.bedActual? ' / 实际 '+r.night.bedActual : ''));
    }
    if(r.kind === 'backfill') out.push('- 补记：'+(r.note||''));
    if(r.lx && r.lx.length) out.push('- 红尘炼心：'+ r.lx.length +' / '+ lxTotal() +' 个动作');
    var pp = lxPrepOf(k);
    if(pp.line || lxPrepCount(pp)){
      var pbits = [];
      if(pp.items && pp.items.clothes) pbits.push('衣服已挂好');
      if(pp.items && pp.items.basin) pbits.push('盆已放');
      if(pp.line) pbits.push('那句话：'+ pp.line);
      out.push('- 前一晚备的：'+ pbits.join(' / '));
    }
    out.push('');
  });
  var shs = shots();
  if(shs.length){
    out.push('# 人生截图', '');
    shs.forEach(function(s){
      out.push('## 第 '+ s.day +' 天 · '+ s.date + (s.locked ? '（底稿，锁定）' : ''));
      SHOT_MO.forEach(function(m){
        var d = (s.mo||{})[m.k] || {};
        if(d.lv || d.t) out.push('- '+ m.n +'（'+ (d.lv ? SHOT_LV[d.lv-1] : '未评') +'）：'+ (d.t||''));
      });
      ['hard','cases','skills'].forEach(function(g){
        var its = s[g] || [];
        if(!its.length) return;
        out.push('### '+ SHOT_GRP[g]);
        its.forEach(function(x){ out.push('- '+ x.t); });
      });
      out.push('');
    });
  }

  download('悦为因-日记-'+todayKey()+'.md', out.join('\n'), 'text/markdown');
  toast('已导出 Markdown');
}

/* ==================== 事件 ==================== */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.dataset.act;

  if(act === 'tab'){ view = t.dataset.v; render(); window.scrollTo(0,0); return; }
  if(act === 'close'){ if(layer._napTimer){ clearInterval(layer._napTimer); layer._napTimer = null; } closeLayer(); return; }
  if(act === 'noop') return;

  if(act === 'shoot'){ shootFlow(); return; }
  if(act === 'breath'){ breathFlow(); return; }
  if(act === 'nap'){ napFlow(); return; }
  if(act === 'nap-end'){ endNap(); return; }
  if(act === 'night'){
    nightFlow(t.dataset.i !== undefined ? parseInt(t.dataset.i, 10) : undefined);
    return;
  }
  if(act === 'night-save'){
    nf.a[nf.i] = ((nf._ta && nf._ta.value) || '').trim();
    var nrs = R(todayKey());
    if(nrs.night){
      saveDraft();
      render();
      closeLayer();
      toast('改好了');
    }
    return;
  }
  if(act === 'nightview'){ showEntry(todayKey()); return; }
  if(act === 'src'){ srcResume = (t.dataset.back === 'night') ? renderNight : null; showSrc(t.dataset.k); return; }
  if(act === 'xsrc'){ showSrc(t.dataset.k); return; }
  if(act === 'src-close'){
    if(srcResume){ var rf = srcResume; srcResume = null; rf(); }
    else closeLayer();
    return;
  }

  /* 熏习 */
  if(act === 'ep-done'){
    var hd = queueHead(); if(!hd) return;
    var c0 = course();
    c0.done[hd.ep.key] = todayKey();
    delete c0.half[hd.ep.key];
    c0.shown = null;
    save();
    var nx = queueHead();
    if(nx){ c0.shown = nx.ep.key; c0.shownAt = todayKey(); save(); }
    render(); window.scrollTo(0,0);
    toast(nx ? '打勾。下一集明天再说' : '这一档走完了');
    return;
  }
  if(act === 'ep-half'){
    var hd2 = queueHead(); if(!hd2) return;
    course().half[hd2.ep.key] = todayKey(); save();
    toast('记下了。明天还是这一集，接着看');
    return;
  }
  if(act === 'ep-filter'){
    course().filter = t.dataset.v; course().shown = null; save();
    render(); window.scrollTo(0,0);
    return;
  }
  if(act === 'ep-locked'){ toast('前面那一集看完了，这里才打开'); return; }
  if(act === 'ep-upgrade'){ toast('在下面的筛选里换一个系列'); return; }

  /* 修行清单 */
  if(act === 'sword' || act === 'law'){
    var v0 = t.dataset.v, kk0 = todayKey(), rr0 = R(kk0);
    var fld = act === 'sword' ? 'swords' : 'laws';
    if(!rr0[fld]) rr0[fld] = [];
    var pos0 = rr0[fld].indexOf(v0);
    if(pos0 >= 0) rr0[fld].splice(pos0,1); else rr0[fld].push(v0);
    save(); t.classList.toggle('on');
    return;
  }
  if(act === 'jin'){
    if(!st.jin) st.jin = [];
    var kToday = todayKey();
    var ent = st.jin[st.jin.length-1];
    if(!ent || ent.date !== kToday){ ent = { date:kToday }; st.jin.push(ent); }
    ent[t.dataset.k] = +t.dataset.v;
    save(); render();
    return;
  }
  if(act === 'stage'){
    if(!st.stage) st.stage = [];
    st.stage.push({ date: todayKey(), level: t.dataset.v });
    save(); render();
    toast('记下了 · ' + t.dataset.v);
    return;
  }
  /* 七剑详解 / 红尘炼心 */
  if(act === 'sword-list'){ swordList(); return; }
  if(act === 'sword-open'){ swordGuide(t.dataset.k); return; }
  if(act === 'ss'){
    var sk = t.dataset.k, si = String(t.dataset.i);
    var sd = ssGet(sk);
    if(sd[si]) delete sd[si]; else sd[si] = todayKey();
    save();
    if(ssCount(sk) >= ssOf(sk)) toast('这一剑，齐了');
    swordGuide(sk);
    return;
  }
  if(act === 'sword-pick'){
    var pk = t.dataset.k, pr = R(todayKey());
    if(!pr.swords) pr.swords = [];
    var pi = pr.swords.indexOf(pk);
    if(pi >= 0) pr.swords.splice(pi,1); else pr.swords.push(pk);
    save();
    toast(pi >= 0 ? '去掉了 · ' + pk : '记上了 · ' + pk);
    swordGuide(pk);
    return;
  }
  if(act === 'lx'){ lxSheet(); return; }
  if(act === 'lx-prep'){ lxPrepSheet(); return; }
  if(act === 'lx-walk'){ lxSheet(); return; }
  if(act === 'lx-close'){
    lxReadLine();
    save(); closeLayer(); render(); return;
  }
  if(act === 'lx-p'){
    lxReadLine();
    var tk = tomorrowKey();
    if(!st.lxPrep) st.lxPrep = {};
    if(!st.lxPrep[tk]) st.lxPrep[tk] = { items:{}, line:'', at:null };
    var pm = st.lxPrep[tk];
    if(!pm.items) pm.items = {};
    var pk = t.dataset.k;
    pm.items[pk] = pm.items[pk] ? 0 : 1;
    pm.at = new Date().toISOString();
    var got = lxPrepCount(pm);
    save();
    lxPrepSheet();
    if(got >= LXP.length) toast('明早的东西齐了');
    return;
  }
  if(act === 'lx-line'){
    lxReadLine(true);
    save(); lxPrepSheet(); toast('存进明早了'); return;
  }
  if(act === 'lx-t'){
    var lr = R(todayKey());
    if(!lr.lx) lr.lx = [];
    var li = lr.lx.indexOf(t.dataset.k);
    if(li >= 0) lr.lx.splice(li,1); else lr.lx.push(t.dataset.k);
    save(); lxSheet();
    return;
  }

  if(act === 'shot-new'){ shotNew(); return; }
  if(act === 'shot-one'){ shotOne(); return; }
  if(act === 'shot-next'){ shotNext(); return; }
  if(act === 'shot-lv'){
    sf.mo[SHOT_MO[sf.step-1].k].lv = +t.dataset.v;
    sfRead(); renderShot();
    return;
  }
  if(act === 'shot-open'){ shotDetail(t.dataset.id); return; }
  if(act === 'shot-cmp'){ shotCompare(); return; }
  if(act === 'shot-tree'){ shotTree(); return; }
  if(act === 'shot-append'){ shotAppend(t.dataset.id, t.dataset.g); return; }
  if(act === 'shot-append-save'){
    var apTxt = (document.getElementById('shot-ap').value || '').trim();
    if(!apTxt){ toast('写一句再确认'); return; }
    var apSh = shots().filter(function(x){ return x.id === t.dataset.id; })[0];
    if(!apSh) return;
    apSh[t.dataset.g] = apSh[t.dataset.g] || [];
    apSh[t.dataset.g].push({ id: sid(), t: apTxt, at: todayKey() });
    apSh.one = false;
    apSh.lastAdd = new Date().toISOString();
    save(); shotDetail(apSh.id); toast('追加了一条');
    return;
  }
  if(act === 'shot-del'){
    var dlSh = shots().filter(function(x){ return x.id === t.dataset.id; })[0];
    if(!dlSh || dlSh.locked) return;
    dlSh[t.dataset.g] = (dlSh[t.dataset.g]||[]).filter(function(x){ return x.id !== t.dataset.i; });
    save(); shotDetail(dlSh.id);
    return;
  }
  if(act === 'shot-mark'){
    if(!st.shotCmp) st.shotCmp = {};
    if(!st.shotCmp[t.dataset.id]) st.shotCmp[t.dataset.id] = {};
    st.shotCmp[t.dataset.id][t.dataset.i] = t.dataset.v;
    save();
    var mkBtns = t.parentNode.querySelectorAll('.chip');
    for(var mi=0; mi<mkBtns.length; mi++) mkBtns[mi].classList.remove('on');
    t.classList.add('on');
    return;
  }

  /* 补卡 */
  if(act === 'makeup'){ makeupFlow(t.dataset.d); return; }
  if(act === 'makeup-save'){
    var mkD = t.dataset.d;
    var mkTxt = (document.getElementById('mk').value || '').trim();
    if(!mkTxt){ toast('写一句再确认'); return; }
    if(cardsLeft() <= 0){ toast('配额不够了'); return; }
    st.records[mkD] = { date:mkD, kind:'makeup', note:mkTxt, makeupAt: todayKey() };
    if(!st.cards) st.cards = { used:[] };
    st.cards.used.push({ date:mkD, at: todayKey() });
    save(); closeLayer(); toast('补上了。这张卡用掉了');
    return;
  }
  if(act === 'backfill'){ backfillFlow(); return; }
  if(act === 'entry'){ showEntry(t.dataset.d); return; }
  if(act === 'day'){
    var dk = t.dataset.d;
    if(st.records[dk]) showEntry(dk);
    else toast('这天没有记录');
    return;
  }
  if(act === 'export'){ exportJSON(); return; }
  if(act === 'import'){ importFlow(); return; }
  if(act === 'exportmd'){ exportMD(); return; }
  if(act === 'togglelow'){
    st.settings.low = !st.settings.low; save(); t.classList.toggle('on'); render();
    toast(st.settings.low ? '低谷模式 · 只留两件事' : '已恢复');
    return;
  }
  if(act === 'resetall'){
    if(confirm('确定清空本机全部记录和照片？这个操作无法撤销。')){
      localStorage.removeItem(KEY);
      try{ localStorage.removeItem('ywyp.'+todayKey()); }catch(e){}
      st = { settings:{}, records:{}, flags:{} };
      view = 'today'; render();    }
    return;
  }
  if(act === 'mute-rebound'){
    st.flags.rebound = st.flags.rebound || {};
    st.flags.rebound[t.dataset.i] = true; save();
    t.parentNode.remove(); return;
  }
  if(act === 'skip-actual'){ st.flags.pendingActual = null; save(); render(); return; }
  if(act === 'bedactual'){
    var pa = st.flags.pendingActual;
    if(pa && st.records[pa] && st.records[pa].night){
      st.records[pa].night.bedActual = t.dataset.v;
      st.flags.pendingActual = null; save(); toast('记下了'); render();
    }
    return;
  }
  if(act === 'focus-wake'){ window.scrollTo({top:0,behavior:'smooth'}); return; }

  /* 夜间流程 */
  if(act === 'night-next'){
    nf.a[nf.i] = (nf._ta && nf._ta.value || '').trim();
    if(!nf.a[nf.i]){ toast('写一句，哪怕是「没想起来」'); return; }
    saveDraft();                      /* 写完这一句就落库，不等到收尾 */
    nf.i++; renderNight(); return;
  }
  if(act === 'four'){ nf.four = t.dataset.v; saveDraft(); renderNight(); return; }
  if(act === 'night-bed'){ if(!nf.four && !nf.noFour){ toast('先选一个'); return; } renderNight(); return; }
  if(act === 'night-skip-four'){ nf.noFour = true; saveDraft(); renderNight(); return; }
  if(act === 'bed'){ nf.bed = t.dataset.v; saveDraft(); renderNight(); return; }
  if(act === 'night-close'){ if(!nf.bed){ toast('选一个时间'); return; } commitNight(); renderNight(); return; }
  if(act === 'night-skip-bed'){ nf.noBed = true; commitNight(); renderNight(); return; }
  if(act === 'night-done'){ closeLayer(); render(); toast('晚安'); return; }

  /* 补记 */
  if(act === 'backfill-save'){
    var txt = (document.getElementById('bf').value || '').trim();
    if(!txt){ toast('写一句就够'); return; }
    var s0 = parseYmd(st.settings.startDate);
    var idx = dayIndex(todayKey());
    for(var j=0;j<idx-1;j++){
      var d = new Date(s0); d.setDate(s0.getDate()+j);
      var k = ymd(d);
      if(!st.records[k]) st.records[k] = { date:k, kind:'backfill', note:txt };
    }
    save(); closeLayer(); toast('空白已经变成数据');
    return;
  }

  /* 首次设置 */
  if(act === 'ob-wake'){ ob.wake = t.dataset.v; renderOnboard(); return; }
  if(act === 'ob-bed'){ ob.bed = t.dataset.v; renderOnboard(); return; }
  if(act === 'ob-next'){ ob.step++; renderOnboard(); return; }
  if(act === 'ob-done'){
    st.settings.wakeTarget = ob.wake;
    st.settings.bedTarget = ob.bed;
    st.settings.startDate = todayKey();
    st.settings.low = false;
    st.course = { start: todayKey(), done:{}, half:{}, shown:null, filter:'ALL' };
    save(); render(); return;
  }
});

/* ==================== 启动 ==================== */
render();
})();
</script>
</body>
</html>
