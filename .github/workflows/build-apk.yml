name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      # 签名密钥：放在仓库 secrets 里，绝不入库。没有配置时会退回临时签名（装不上旧版本）。
      BV_KEYSTORE_B64: ${{ secrets.BV_KEYSTORE_B64 }}
      BV_STORE_PASSWORD: ${{ secrets.BV_STORE_PASSWORD }}
      BV_KEY_PASSWORD: ${{ secrets.BV_STORE_PASSWORD }}
      BV_KEY_ALIAS: brightview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 注意：不能使用 setup-android 的默认 packages（含 tools），
      # 新版 SDK 仓库已移除 tools 包，sdkmanager 会直接以 1 退出。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Prepare signing key
        run: |
          if [ -n "$BV_KEYSTORE_B64" ]; then
            printf '%s' "$BV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/brightview.jks"
            echo "BV_STORE_FILE=$RUNNER_TEMP/brightview.jks" >> "$GITHUB_ENV"
            echo "用仓库自持密钥签名，可覆盖安装旧版本"
          else
            echo "::warning::未配置签名密钥，本次为临时签名，无法覆盖已安装版本"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify signature
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | head -6

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/yuean-zhidao-${GITHUB_REF_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuean-zhidao-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
